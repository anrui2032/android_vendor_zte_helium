syntax = "proto2";
import "nanopb.proto";
//import "sns_std_sensor.proto";

enum sns_lcd_level_msgid
{
  option (nanopb_enumopt).long_names = false;

 SNS_LCD_LEVEL_MSGID_LIGHT_LEVEL = 1080;
 
 SNS_LCD_LEVEL_MSGID_LIGHT_LEVEL_EVENT = 1081;
}


// Configuration Message
// Used to either request for a certain configuration of the Sim Sensor or
// alter an already existing configuration of the Simulation Sensor
// Uses sns_std_sensor_config defined in sns_std_sensor.proto
// The message field definitions are as follows:
// 1) float sample_rate
//      containing the required sample rate of the Sim sensor in hertz

// Data Message
// Output data event generated by the sns_lcd_level sensor.
message sns_lcd_level_data
{
  // sns_lcd_level_event set current lcd level to drivers
  required float level = 1;
}

// Sensor set_brightness test event
message sns_set_lcd_level_data_event
{
  // Result if the test execution was successful:
  // true for success
  // false for failure
  required bool set_result = 1 [default = true];

}

